name: Bug report
description: Report a reproducible problem using synthetic or redacted data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private conversations, or Vault files. Report security issues through GitHub Security Advisories instead.
  - type: input
    id: version
    attributes:
      label: Linger version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Adapter
      options:
        - Claude Code
        - Codex
        - CLI only
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted data only.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Include redacted `linger status` or `linger doctor` output when useful.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, private conversations, and personal Vault data.
          required: true
