name: Publish v1.1.0 to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-linger-skill-v1.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 6286c2222d9e2ec158dc5612387e7f9e39989f46
          persist-credentials: false
      - name: Verify exact release commit
        run: test "$(git rev-parse HEAD)" = 6286c2222d9e2ec158dc5612387e7f9e39989f46
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Pin Trusted Publishing compatible npm
        run: npm install --global npm@11.5.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - name: Publish exact release package
        run: npm publish --access public --provenance
